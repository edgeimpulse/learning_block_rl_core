[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ei-rl"
version = "0.1.0"
description = "Shared code for Edge Impulse RL learning blocks: the Studio contract, the formats the RL Studio extensions read, trainer integrations"
readme = "README.md"
license = "BSD-3-Clause-Clear"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Lower bounds only: each block pins exact versions in its own requirements
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
# The simulation bundle (ei_rl.bundle)
mujoco = ["mujoco>=3.2"]
# The Gymnasium + Stable-Baselines3 integration (ei_rl.sb3)
sb3 = ["stable-baselines3>=2.3", "torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17"]
# The mjlab + rsl_rl integration (ei_rl.mjlab); mjlab brings rsl_rl, torch and mujoco
mjlab = ["mjlab>=1.3"]

[tool.setuptools.packages.find]
include = ["ei_rl*"]
